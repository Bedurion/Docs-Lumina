name: Publish approved website content

run-name: Website submission ${{ inputs.submission_id }} · ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Public-safe Luminox submission reference
        required: true
        type: string
      payload:
        description: AES-256-GCM encrypted publication payload
        required: true
        type: string
      dispatch_id:
        description: Unique non-secret dispatch correlation reference
        required: true
        type: string

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require the repository default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${REQUESTED_REF}" != "${expected_ref}" ]]; then
            echo "Website publication is restricted to ${expected_ref}; received ${REQUESTED_REF}." >&2
            exit 1
          fi

  sanitize:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out the documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked media tooling without package scripts
        run: npm ci --ignore-scripts

      - name: Install isolated video sanitizer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Validate and stage approved website content
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          ENCRYPTED_PAYLOAD: ${{ inputs.payload }}
          PUBLISH_PAYLOAD_SECRET: ${{ secrets.WEBSITE_PUBLISH_PAYLOAD_SECRET }}
          PUBLICATION_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
          PUBLICATION_OUTPUT_DIR: publication
        run: node tools/publish-community-media.mjs

      - name: Upload isolated publication artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-${{ inputs.submission_id }}
          path: publication
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  publish:
    needs:
      - guard
      - sanitize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
    concurrency:
      group: luminox-community-media-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install locked validation tooling without package scripts
        run: npm ci --ignore-scripts

      - name: Download isolated publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: publication-${{ inputs.submission_id }}
          path: publication

      - name: Apply safely to the latest branch and publish
        id: publish
        shell: bash
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          PUBLICATION_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "Luminox Website Publisher"
          git config user.email "luminox-publisher@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          remote_ref="refs/remotes/origin/${branch}"

          for attempt in 1 2 3; do
            git fetch --no-tags origin "+refs/heads/${branch}:${remote_ref}"
            git reset --hard "${remote_ref}"
            git clean -fd -- assets/community data

            node tools/verify-community-artifact.mjs \
              publication \
              "${SUBMISSION_ID}" \
              "${DISPATCH_ID}" \
              "${PUBLICATION_WORKFLOW_RUN_NUMBER}"
            npm test

            git add -- \
              assets/community \
              data/community-media.json \
              data/blog-posts.json \
              data/art-entries.json \
              data/roleplay-stories.json \
              .github/community-publication-state.json

            if git diff --cached --quiet; then
              published_sha="$(git rev-parse HEAD)"
              echo "Publication was already present at ${published_sha}."
              echo "published_sha=${published_sha}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git commit -m "Publish approved website content ${SUBMISSION_ID}"
            published_sha="$(git rev-parse HEAD)"

            if git push origin "HEAD:refs/heads/${branch}"; then
              echo "published_sha=${published_sha}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Branch advanced during publish attempt ${attempt}; rebuilding from the latest commit."
          done

          echo "Could not publish safely after three branch updates." >&2
          exit 1

  deploy:
    needs:
      - guard
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: luminox-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the newly published website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.published_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select a non-regressing deployment revision
        id: revision
        shell: bash
        env:
          PUBLISHED_SHA: ${{ needs.publish.outputs.published_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${PUBLISHED_SHA}" ]]; then
            echo "Checked-out SHA does not match the publication output." >&2
            exit 1
          fi

          branch="${GITHUB_REF_NAME}"
          remote_ref="refs/remotes/origin/${branch}"
          git fetch --no-tags origin "+refs/heads/${branch}:${remote_ref}"
          latest_sha="$(git rev-parse "${remote_ref}")"

          deployment_sha="$(
            node tools/select-community-deployment-revision.mjs \
              "${PUBLISHED_SHA}" \
              "${latest_sha}"
          )"

          if [[ "${deployment_sha}" == "${PUBLISHED_SHA}" ]]; then
            echo "Deploying the exact requested publication; later ordinary commits remain outside this release."
          else
            echo "Deploying the exact newer publication ${deployment_sha} to avoid an out-of-order rollback."
          fi

          echo "deployment_sha=${deployment_sha}" >> "${GITHUB_OUTPUT}"

      - name: Prepare static Pages artifact
        env:
          DEPLOYMENT_SHA: ${{ steps.revision.outputs.deployment_sha }}
        run: |
          mkdir site
          git archive "${DEPLOYMENT_SHA}" | tar -x -C site
          rm -rf site/.github site/tools site/package.json site/package-lock.json site/README.md site/.gitignore
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
